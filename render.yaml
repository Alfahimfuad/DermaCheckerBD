
# Render Blueprint for DermaCheckerBD.
# Create the Neon database first, then set DATABASE_URL in the Render dashboard.

services:
  - type: web
    name: dermacheckerbd-web
    runtime: python
    plan: free
    branch: main
    healthCheckPath: /healthz/

    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput

    # Run migrations and ensure the admin user before starting Gunicorn.
    # One worker helps keep startup operations serial.
    startCommand: python manage.py migrate --noinput && python manage.py ensure_render_superuser && gunicorn dermacheckerbd.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120

    envVars:
      # Django Configuration
      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        sync: false

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      # Django Superuser
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false

      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # Neon PostgreSQL Database
      - key: DATABASE_URL
        sync: false

      # Persistent Image Storage
      - key: CLOUDINARY_URL
        sync: false

      # Gemini Chatbot
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.0-flash

      # Nearby Doctors (Optional)
      - key: GEOAPIFY_API_KEY
        sync: false

      # ML API Configuration
      - key: ML_MODEL_BACKEND
        value: api

      # API 1: Seven-Class Skin Disease Prediction
      - key: AI_API_URL
        sync: false

      # API 2: Skin vs Non-Skin Validation
      - key: AI_SKIN_API_URL
        sync: false
      - key: AI_SKIN_API_PATH
        value: /api/check-skin
      - key: AI_SKIN_API_FILE_FIELD
        value: file

      # API Authentication (if required)
      - key: AI_API_TOKEN
        sync: false
      - key: AI_SKIN_API_TOKEN
        sync: false

      # Request Timeout
      - key: AI_API_TIMEOUT
        value: "120"

      # Seven-Class Skin Disease Model Labels
      - key: ML_MODEL_CLASSES
        value: "akiec,bcc,bkl,df,mel,nv,vasc"

      # Phone-image (SkinDisNet) prediction model — fully separate workflow.
      # Leave ML_PHONE_MODEL_BACKEND empty/unset to DISABLE phone-image
      # predictions (the button surfaces a clear "not configured" error).
      # Set to "api" to forward phone uploads to a separate FastAPI service,
      # or "keras" to load a separately trained Keras model from ML_PHONE_MODEL_PATH.
      - key: ML_PHONE_MODEL_BACKEND
        value: ""
      - key: ML_PHONE_MODEL_CLASSES
        value: "atopic_dermatitis,contact_dermatitis,eczema,scabies,seborrheic_dermatitis,tinea_corporis"
      # Optional separate FastAPI service for phone images.
      - key: AI_PHONE_API_URL
        sync: false
      - key: AI_PHONE_API_TOKEN
        sync: false

      # Metadata fields the trained phone-image model actually consumes.
      # Default to False — never assume the model uses age/sex/location.
      # Patient ID is for record-keeping only; it is NEVER a model feature.
      - key: PHONE_MODEL_USES_AGE
        value: "False"
      - key: PHONE_MODEL_USES_SEX
        value: "False"
      - key: PHONE_MODEL_USES_LOCATION
        value: "False"
      - key: PHONE_LESION_LOCATIONS
        value: ""

      # Quality-score threshold (0..100) below which both prediction
      # buttons are disabled. Per spec, predictions require >= 50%.
      - key: PREDICTION_MIN_QUALITY_SCORE
        value: "50"

      # Similar Cases Feature
      - key: SIMILAR_CASES_ENABLED
        value: "False"

    autoDeployTrigger: commit
